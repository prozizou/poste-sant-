name: Apply multi-village code update
on:
  push:
    branches:
      - feat/multi-villages-superadmin-20261024
    paths:
      - '.migration/READY'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and apply code-only patch
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/part*.b64 | base64 --decode | xz --decompress --stdout > /tmp/multivillages.patch
          echo "6537a301b26bf33214f8576b88414b35007e21f193663eae621d3dc0da184d32  /tmp/multivillages.patch" | sha256sum --check
          git apply -p2 --check /tmp/multivillages.patch
          git apply -p2 /tmp/multivillages.patch
          rm -rf .migration
          rm -f .github/workflows/apply-multivillages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: multi-village isolation and superadmin hierarchy'
          git push origin HEAD:feat/multi-villages-superadmin-20261024
