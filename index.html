<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion – Poste de Santé de Diandioly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:   #1a3a5c;
            --primary-light: #274e74;
            --accent:    #0ea472;
            --accent-bg: #e6f7f1;
            --danger:    #c0392b;
            --bg:        #f0f4f8;
            --card-bg:   #ffffff;
            --text:      #1e2a38;
            --muted:     #6b7a8d;
            --border:    #d8e0e8;
            --shadow:    0 12px 40px rgba(26,58,92,0.10);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }
        .login-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px 35px;
            border: 1px solid rgba(216,224,232,0.6);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .header p {
            color: var(--muted);
            font-size: 0.9rem;
        }
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
            background: #f4f7fa;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .role-btn {
            border: none;
            background: transparent;
            padding: 12px;
            border-radius: 9px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .role-btn:hover {
            color: var(--primary);
        }
        .role-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 4px 12px rgba(26,58,92,0.08);
            border: 1px solid rgba(216,224,232,0.5);
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text);
            background: #fafbfc;
            transition: all 0.2s ease;
        }
        .input-wrapper input[type="email"]:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(26,58,92,0.06);
        }
        .passcode-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 5px;
        }
        .passcode-container input {
            width: 100%;
            height: 52px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: #fafbfc;
            color: var(--primary);
            transition: all 0.15s ease;
        }
        .passcode-container input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(26,58,92,0.06);
        }
        .passcode-container input.filled {
            background: #f0f4f8;
            border-color: var(--border);
        }
        .error-box {
            background: #fdf2f2;
            border: 1px solid #f8b4b4;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: none;
            align-items: flex-start;
            gap: 10px;
        }
        .error-box.visible {
            display: flex;
        }
        .error-box svg {
            width: 18px;
            height: 18px;
            fill: var(--danger);
            flex-shrink: 0;
            margin-top: 1px;
        }
        .error-box span {
            font-size: 0.85rem;
            color: var(--danger);
            font-weight: 500;
            line-height: 1.4;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .submit-btn:hover:not(:disabled) {
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .submit-btn:disabled {
            background: var(--muted);
            opacity: 0.6;
            cursor: not-allowed;
        }
        .submit-btn.success {
            background: var(--accent) !important;
        }
        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 0.78rem;
            color: var(--muted);
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header">
            <h1>Poste de Santé de Diandioly</h1>
            <p>Portail d'accès sécurisé</p>
        </div>

        <div class="role-selector">
            <button type="button" class="role-btn active" id="btn-admin" onclick="selectRole('admin')">
                🛡️ Admin
            </button>
            <button type="button" class="role-btn" id="btn-caissier" onclick="selectRole('caissier')">
                🧾 Caisse / Facturation
            </button>
        </div>

        <div class="error-box" id="error-box">
            <svg viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"/></svg>
            <span id="error-text">Identifiants incorrects.</span>
        </div>

        <form onsubmit="event.preventDefault(); handleLogin();" novalidate>
            <div class="form-group">
                <label for="email">Adresse Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" autocomplete="username" placeholder="exemple@sante.sn" required>
                </div>
            </div>

            <div class="form-group">
                <label>Code Secret (6 chiffres)</label>
                <div class="passcode-container" id="passcode-fields">
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" required>
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" required>
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" required>
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" required>
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" required>
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" required>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Se Connecter</button>
        </form>

        <div class="footer-note">
            République du Sénégal · Système National d'Information Sanitaire
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import {
            signInWithEmailAndPassword,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // ─── Rôles & redirections ──────────────────────────────────────
        let currentRole = 'admin';

        window.selectRole = function(role) {
            currentRole = role;
            const btnAdmin    = document.getElementById('btn-admin');
            const btnCaissier = document.getElementById('btn-caissier');
            if (role === 'admin') {
                btnAdmin.classList.add('active');
                btnAdmin.style.cssText = '';
                btnCaissier.classList.remove('active');
                btnCaissier.style.borderColor = 'var(--border)';
                btnCaissier.style.background   = '#fafbfc';
                btnCaissier.style.color        = 'var(--muted)';
            } else {
                btnCaissier.classList.add('active');
                btnCaissier.style.cssText = '';
                btnAdmin.classList.remove('active');
                btnAdmin.style.borderColor = 'var(--border)';
                btnAdmin.style.background   = '#fafbfc';
                btnAdmin.style.color        = 'var(--muted)';
            }
        };

        // Gestion automatique des champs passcode
        const digits = document.querySelectorAll('.digit');
        digits.forEach((inp, i) => {
            inp.addEventListener('input', () => {
                inp.value = inp.value.replace(/[^0-9]/g, '');
                if (inp.value) {
                    inp.classList.add('filled');
                    if (i < 5) digits[i + 1].focus();
                } else {
                    inp.classList.remove('filled');
                }
            });
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !inp.value && i > 0) {
                    digits[i - 1].focus();
                    digits[i - 1].value = '';
                    digits[i - 1].classList.remove('filled');
                }
                if (e.key === 'Enter') handleLogin();
            });
        });

        function showError(msg) {
            document.getElementById('error-text').textContent = msg;
            document.getElementById('error-box').classList.add('visible');
        }
        function hideError() {
            document.getElementById('error-box').classList.remove('visible');
        }

        // Si déjà connecté dans l'historique de session, rediriger directement
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const savedRole = sessionStorage.getItem('userRole');
                if (savedRole === 'admin') {
                    window.location.href = 'accueil/menu_admin.html';
                } else if (savedRole === 'caissier') {
                    window.location.href = 'accueil/menu_caissier.html';
                }
            }
        });

        // Fonction d'authentification principale liée à Firebase
        window.handleLogin = async function() {
            hideError();
            const email    = document.getElementById('email').value.trim();
            const passcode = Array.from(digits).map(d => d.value).join('');

            if (!email) { showError('Veuillez saisir votre adresse email.'); return; }
            if (passcode.length < 6) { showError('Veuillez saisir les 6 chiffres de votre code secret.'); return; }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Authentification…';

            try {
                // 1. LISTE BLANCHE DES EMAILS (Ajuster ici selon vos comptes réels)
                const ADMIN_EMAILS = ['adminposte@diandioly.com'];
                const CAISSIER_EMAILS = ['caisse@sante.sn'];

                // 2. Authentification Firebase
                await signInWithEmailAndPassword(auth, email, passcode);

                // 3. VÉRIFICATION STRICTE DES DROITS PAR RÔLE
                const userEmail = email.toLowerCase();
                let accessGranted = false;

                if (currentRole === 'admin' && ADMIN_EMAILS.includes(userEmail)) {
                    accessGranted = true;
                } else if (currentRole === 'caissier' && CAISSIER_EMAILS.includes(userEmail)) {
                    accessGranted = true;
                }

                // 4. Blocage si l'utilisateur n'a pas sélectionné son bon rôle dédié
                if (!accessGranted) {
                    await auth.signOut(); // Déconnexion immédiate de la session non légitime
                    showError(`Accès refusé. L'email ${userEmail} n'est pas configuré pour le rôle : ${currentRole}.`);
                    btn.disabled = false;
                    btn.textContent = 'Se Connecter';
                    return; 
                }

                // 5. Autorisation accordée
                sessionStorage.setItem('userRole', currentRole);
                sessionStorage.setItem('userEmail', email);
                btn.classList.add('success');
                btn.textContent = '✓ Connexion réussie – Redirection…';
                
                setTimeout(() => {
                    if (currentRole === 'admin') {
                        window.location.href = 'accueil/menu_admin.html';
                    } else {
                        window.location.href = 'accueil/menu_caissier.html';
                    }
                }, 900);

            } catch (error) {
                btn.disabled = false;
                btn.textContent = 'Se Connecter';
                switch (error.code) {
                    case 'auth/invalid-credential':
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                        showError('Email ou code secret incorrect.'); break;
                    case 'auth/invalid-email':
                        showError('Adresse email invalide.'); break;
                    case 'auth/too-many-requests':
                        showError('Compte temporairement bloqué. Réessayez dans quelques minutes.'); break;
                    case 'auth/network-request-failed':
                        showError('Pas de connexion réseau. Vérifiez votre connexion Internet.'); break;
                    default:
                        showError('Une erreur inattendue est survenue. Veuillez réessayer.');
                }
            }
        };
    </script>
</body>
</html>
