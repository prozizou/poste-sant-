<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a3a5c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PS Diandioly">
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png">
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png">
    <meta name="msapplication-TileColor" content="#1a3a5c">
    <meta name="description" content="Application de gestion du Poste de Santé de Diandioly – Facturation, Stock, Rapports.">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png">
    <title>Connexion – Poste de Santé de Diandioly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:   #1a3a5c;
            --primary-light: #274e74;
            --accent:    #0ea472;
            --accent-bg: #e6f7f1;
            --danger:    #c0392b;
            --bg:        #f0f4f8;
            --card-bg:   #ffffff;
            --text:      #1e2a38;
            --muted:     #6b7a8d;
            --border:    #d8e0e8;
            --shadow:    0 12px 40px rgba(26,58,92,0.10);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html,body{max-width:100%;overflow-x:hidden;overflow-x:clip;}
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }
        .login-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px 35px;
            border: 1px solid rgba(216,224,232,0.6);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .header p {
            color: var(--muted);
            font-size: 0.9rem;
        }
        .role-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 30px;
            background: #f4f7fa;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .role-btn {
            border: none;
            background: transparent;
            padding: 12px;
            border-radius: 9px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .role-btn:hover { color: var(--primary); }
        .role-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 4px 12px rgba(26,58,92,0.08);
            border: 1px solid rgba(216,224,232,0.5);
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .forgot-link {
            text-transform: none;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .forgot-link:hover { text-decoration: underline; }
        .input-wrapper input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text);
            background: #fafbfc;
            transition: all 0.2s ease;
        }
        .input-wrapper input[type="email"]:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(26,58,92,0.06);
        }
        .passcode-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 5px;
        }
        .passcode-container input {
            width: 100%;
            height: 52px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: #fafbfc;
            color: var(--primary);
            transition: all 0.15s ease;
        }
        .passcode-container input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(26,58,92,0.06);
        }
        .passcode-container input.filled {
            background: #f0f4f8;
            border-color: var(--border);
        }
        .message-box {
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: none;
            align-items: flex-start;
            gap: 10px;
        }
        .message-box.visible { display: flex; }
        .message-box.error {
            background: #fdf2f2;
            border: 1px solid #f8b4b4;
        }
        .message-box.error span { color: var(--danger); }
        .message-box.error svg { fill: var(--danger); }
        .message-box.success {
            background: var(--accent-bg);
            border: 1px solid var(--accent);
        }
        .message-box.success span { color: var(--accent); }
        .message-box svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .message-box span {
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1.4;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .submit-btn:hover:not(:disabled) {
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .submit-btn:disabled {
            background: var(--muted);
            opacity: 0.6;
            cursor: not-allowed;
        }
        .submit-btn.success-state { background: var(--accent) !important; }
        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 0.78rem;
            color: var(--muted);
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        /* ── PWA Install Banner ──────────────────────────── */
        #pwa-banner {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--primary);
            color: #fff;
            padding: 14px 20px;
            z-index: 9999;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 -4px 20px rgba(26,58,92,0.25);
            animation: slideUp 0.35s ease;
        }
        #pwa-banner.visible { display: flex; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        #pwa-banner .banner-text {
            display: flex; align-items: center; gap: 10px; flex: 1;
        }
        #pwa-banner .banner-icon { font-size: 1.6rem; flex-shrink: 0; }
        #pwa-banner .banner-copy { font-size: 0.82rem; line-height: 1.4; }
        #pwa-banner .banner-copy strong { font-size: 0.9rem; display: block; }
        #pwa-banner .banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
        #pwa-banner .btn-install {
            padding: 8px 16px; border-radius: 8px;
            background: var(--accent); color: #fff;
            border: none; font-size: 0.82rem; font-weight: 700;
            cursor: pointer; white-space: nowrap;
        }
        #pwa-banner .btn-dismiss {
            padding: 8px 12px; border-radius: 8px;
            background: rgba(255,255,255,0.15); color: #fff;
            border: none; font-size: 0.82rem; font-weight: 600;
            cursor: pointer;
        }
        /* Update toast */
        #update-toast {
            display: none; position: fixed;
            top: 16px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: #fff;
            padding: 12px 20px; border-radius: 10px;
            font-size: 0.83rem; font-weight: 600;
            z-index: 9999; white-space: nowrap;
            box-shadow: 0 4px 16px rgba(26,58,92,0.3);
            align-items: center; gap: 10px;
        }
        #update-toast.visible { display: flex; }
        #update-toast button {
            background: var(--accent); border: none; color: #fff;
            padding: 5px 12px; border-radius: 6px;
            font-size: 0.8rem; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header">
            <h1>Poste de Santé de Diandioly</h1>
            <p>Portail d'accès sécurisé</p>
        </div>

        <div class="role-selector">
            <button type="button" class="role-btn active" id="btn-admin" onclick="selectRole('admin')">
                🛡️ Admin
            </button>
            <button type="button" class="role-btn" id="btn-caissier" onclick="selectRole('caissier')">
                🧾 Caisse
            </button>
            <button type="button" class="role-btn" id="btn-tresorier" onclick="selectRole('tresorier')">
                💰 Trésorier
            </button>
        </div>

        <div class="message-box" id="message-box">
            <svg viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"/></svg>
            <span id="message-text">Message ici</span>
        </div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="email">Adresse Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" autocomplete="username" placeholder="exemple@sante.sn" required>
                </div>
            </div>

            <div class="form-group">
                <label>
                    Code Secret (6 chiffres)
                    <span class="forgot-link" onclick="handleResetPassword()">Code oublié ?</span>
                </label>
                <div class="passcode-container" id="passcode-fields">
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 1" required>
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 2" required>
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 3" required>
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 4" required>
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 5" required>
                    <input type="password" class="digit" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 6" required>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Se Connecter</button>
        </form>

        <div class="footer-note">
            Besoin d'assistance ?
            Contactez-nous au +221 77 350 05 95
        </div>
    </div>

    <script type="module">
        // 1. IMPORTS
        import { auth, db } from './firebase-config.js'; // db est maintenant la Realtime Database
        import {
            signInWithEmailAndPassword,
            onAuthStateChanged,
            sendPasswordResetEmail,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        
        // Imports spécifiques pour Realtime Database
        import {
            ref,
            query,
            orderByChild,
            equalTo,
            get
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // 2. GESTION DES RÔLES
        let currentRole = 'admin';

        // Cible de redirection selon le rôle
        const ROLE_HOME = {
            admin:     'accueil/menu_admin.html',
            caissier:  'accueil/menu_caissier.html',
            tresorier: 'accueil/menu_tresorier.html',
        };

        window.selectRole = function(role) {
            currentRole = role;
            const buttons = {
                admin:     document.getElementById('btn-admin'),
                caissier:  document.getElementById('btn-caissier'),
                tresorier: document.getElementById('btn-tresorier'),
            };

            Object.values(buttons).forEach(btn => {
                if (!btn) return;
                btn.classList.remove('active');
                btn.style.borderColor = 'var(--border)';
                btn.style.background = '#fafbfc';
                btn.style.color = 'var(--muted)';
            });

            const activeBtn = buttons[role];
            if (activeBtn) { activeBtn.classList.add('active'); activeBtn.style.cssText = ''; }
        };

        // 3. GESTION DU CODE SECRET (Saisie & Copier-Coller)
        const digits = document.querySelectorAll('.digit');
        const passcodeContainer = document.getElementById('passcode-fields');

        digits.forEach((inp, i) => {
            inp.addEventListener('input', () => {
                inp.value = inp.value.replace(/[^0-9]/g, ''); 
                if (inp.value) {
                    inp.classList.add('filled');
                    if (i < 5) digits[i + 1].focus();
                } else {
                    inp.classList.remove('filled');
                }
            });

            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !inp.value && i > 0) {
                    digits[i - 1].focus();
                    digits[i - 1].value = '';
                    digits[i - 1].classList.remove('filled');
                }
            });
        });

        passcodeContainer.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
            if (pastedData) {
                digits.forEach((input, i) => {
                    input.value = pastedData[i] || '';
                    if (pastedData[i]) {
                        input.classList.add('filled');
                    } else {
                        input.classList.remove('filled');
                    }
                });
                const lastIndex = Math.min(pastedData.length, 5);
                digits[lastIndex].focus();
            }
        });

        // 4. MESSAGES UTILISATEUR
        const msgBox = document.getElementById('message-box');
        const msgText = document.getElementById('message-text');

        function showMessage(msg, type = 'error') {
            msgText.textContent = msg;
            msgBox.className = `message-box visible ${type}`;
        }
        function hideMessage() {
            msgBox.className = 'message-box';
        }

        // 5. AUTO-CONNEXION : on garde la session ouverte entre deux visites.
        // browserLocalPersistence conserve l'authentification Firebase même
        // après fermeture de l'app ; le rôle est mémorisé dans localStorage.
        // Résultat : après une première connexion réussie, l'utilisateur est
        // redirigé automatiquement vers son menu au prochain lancement, sans
        // ressaisir email + code (jusqu'à ce qu'il se déconnecte).
        setPersistence(auth, browserLocalPersistence).catch(() => {});

        onAuthStateChanged(auth, async (user) => {
            if (!user) return;
            let role = sessionStorage.getItem('userRole') || localStorage.getItem('savedRole');
            // Rôle mémorisé absent (ex. connexion faite sur une ancienne version) :
            // on le récupère directement depuis la base pour toute session déjà
            // ouverte → l'auto-connexion fonctionne sans dépendre du localStorage.
            if (!ROLE_HOME[role]) {
                try {
                    const email = (user.email || '').toLowerCase();
                    const snap = await get(query(ref(db, 'administration/auth_db'), orderByChild('email'), equalTo(email)));
                    if (snap.exists()) snap.forEach(c => { role = c.val().role; });
                } catch (e) { /* réseau/permissions : on reste sur l'écran de connexion */ }
            }
            if (!ROLE_HOME[role]) return;
            // On mémorise et on réalimente sessionStorage pour les pages de menu.
            localStorage.setItem('savedRole', role);
            localStorage.setItem('savedEmail', user.email || '');
            sessionStorage.setItem('userRole', role);
            sessionStorage.setItem('userEmail', user.email || '');
            window.location.href = ROLE_HOME[role];
        });

        // 6. MOT DE PASSE OUBLIÉ
        window.handleResetPassword = async function() {
            hideMessage();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMessage("Saisissez d'abord votre adresse email pour réinitialiser le code.");
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                showMessage("Un email de réinitialisation a été envoyé.", "success");
            } catch (error) {
                showMessage("Erreur lors de l'envoi de l'email de réinitialisation.");
            }
        };

        // 7. SOUMISSION DU FORMULAIRE (Auth + Realtime Database)
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();
            
            const email = document.getElementById('email').value.trim().toLowerCase();
            const passcode = Array.from(digits).map(d => d.value).join('');

            if (!email) { showMessage('Veuillez saisir votre adresse email.'); return; }
            if (passcode.length < 6) { showMessage('Veuillez saisir les 6 chiffres de votre code secret.'); return; }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Authentification…';

            try {
                // ÉTAPE 1 : Authentification Firebase (Vérifie Email + Mot de passe)
                await signInWithEmailAndPassword(auth, email, passcode);

                // ÉTAPE 2 : Vérification du Rôle dans Realtime Database
                const dbRef = ref(db, 'administration/auth_db');
                const roleQuery = query(dbRef, orderByChild('email'), equalTo(email));
                const snapshot = await get(roleQuery);

                let dbRole = null;
                
                if (snapshot.exists()) {
                    // Firebase retourne un objet contenant les correspondances, on boucle dessus
                    snapshot.forEach((childSnapshot) => {
                        dbRole = childSnapshot.val().role;
                    });
                }

                // ÉTAPE 3 : Comparaison des rôles
                if (dbRole !== currentRole) {
                    await auth.signOut(); // Déconnexion immédiate
                    showMessage(`Accès refusé. L'email n'a pas les droits pour le rôle : ${currentRole}.`);
                    btn.disabled = false;
                    btn.textContent = 'Se Connecter';
                    return; 
                }

                // ÉTAPE 4 : Succès et Redirection
                sessionStorage.setItem('userRole', currentRole);
                sessionStorage.setItem('userEmail', email);
                // Mémorisation persistante pour l'auto-connexion des prochaines visites.
                localStorage.setItem('savedRole', currentRole);
                localStorage.setItem('savedEmail', email);
                btn.classList.add('success-state');
                btn.textContent = '✓ Connexion réussie';
                
                setTimeout(() => {
                    window.location.href = ROLE_HOME[currentRole] || 'accueil/menu_caissier.html';
                }, 900);

            } catch (error) {
                btn.disabled = false;
                btn.textContent = 'Se Connecter';
                switch (error.code) {
                    case 'auth/invalid-credential':
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                        showMessage('Email ou code secret incorrect.'); break;
                    case 'auth/invalid-email':
                        showMessage('Adresse email invalide.'); break;
                    case 'auth/too-many-requests':
                        showMessage('Compte temporairement bloqué. Réessayez plus tard.'); break;
                    case 'auth/network-request-failed':
                        showMessage('Vérifiez votre connexion Internet.'); break;
                    default:
                        showMessage('Une erreur inattendue est survenue.');
                        console.error(error);
                }
            }
        });
    </script>

    <!-- PWA Install Banner -->
    <div id="pwa-banner" role="complementary" aria-label="Installer l'application">
        <div class="banner-text">
            <span class="banner-icon">🏥</span>
            <div class="banner-copy">
                <strong>Installer l'application</strong>
                Accès rapide depuis votre écran d'accueil
            </div>
        </div>
        <div class="banner-actions">
            <button class="btn-install" id="btn-install-pwa">Installer</button>
            <button class="btn-dismiss" id="btn-dismiss-pwa" aria-label="Fermer">✕</button>
        </div>
    </div>

    <!-- Update available toast -->
    <div id="update-toast" role="alert">
        <span>🔄 Mise à jour disponible</span>
        <button id="btn-update-pwa">Actualiser</button>
    </div>

    <script>
    // ── Service Worker Registration ──────────────────────────────────────
    let deferredInstallPrompt = null;

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
            try {
                const reg = await navigator.serviceWorker.register('/sw.js');
                console.log('[PWA] Service Worker enregistré :', reg.scope);

                // Détection mise à jour
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            document.getElementById('update-toast').classList.add('visible');
                        }
                    });
                });
            } catch (err) {
                console.warn('[PWA] Enregistrement SW échoué :', err);
            }
        });

        // Rechargement après mise à jour
        document.getElementById('btn-update-pwa').addEventListener('click', () => {
            navigator.serviceWorker.controller?.postMessage({ type: 'SKIP_WAITING' });
            window.location.reload();
        });

        navigator.serviceWorker.addEventListener('controllerchange', () => {
            window.location.reload();
        });
    }

    // ── Install Prompt (Android / Desktop Chrome) ────────────────────────
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        // Afficher le banner seulement si pas déjà installé
        if (!window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('pwa-banner').classList.add('visible');
        }
    });

    document.getElementById('btn-install-pwa').addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        document.getElementById('pwa-banner').classList.remove('visible');
        console.log('[PWA] Installation :', outcome);
    });

    document.getElementById('btn-dismiss-pwa').addEventListener('click', () => {
        document.getElementById('pwa-banner').classList.remove('visible');
        // Ne pas reproposer avant 3 jours
        localStorage.setItem('pwa-banner-dismissed', Date.now());
    });

    // Vérifier si déjà refusé récemment
    window.addEventListener('DOMContentLoaded', () => {
        const dismissed = localStorage.getItem('pwa-banner-dismissed');
        if (dismissed && Date.now() - parseInt(dismissed) < 3 * 24 * 60 * 60 * 1000) {
            document.getElementById('pwa-banner').style.display = 'none !important';
        }
    });

    // ── Installed event ──────────────────────────────────────────────────
    window.addEventListener('appinstalled', () => {
        document.getElementById('pwa-banner').classList.remove('visible');
        console.log('[PWA] Application installée avec succès');
    });
    </script>
</body>
</html>
