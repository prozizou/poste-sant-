<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dépenses &amp; Bilan – Poste de Santé de Diandioly</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rapport-print.css">
    <style>
        :root{
            --primary:#1a3a5c;--primary-light:#2b5580;--primary-bg:#eaf0f6;
            --accent:#0ea472;--accent-dark:#0b7d54;--accent-bg:#e6f7f1;
            --gold:#d68910;--gold-dark:#b87309;--gold-bg:#fef9ec;
            --danger:#c0392b;--danger-dark:#96271b;--danger-bg:#fdf1f0;
            --purple:#7b5ea7;--purple-bg:#f0ebf8;--blue-bg:#e8f0f8;
            --bg:#f4f6f8;--card-bg:#fff;--text:#1e2a38;--muted:#6b7a8d;--border:#d8e0e8;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        html,body{max-width:100%;overflow-x:hidden;overflow-x:clip;}
        body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:clip;}
        .icon{width:1em;height:1em;display:inline-block;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
        .icon.dots{fill:currentColor;stroke:none;}

        /* ── TOPBAR ── */
        .topbar{background:var(--primary);color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 10px rgba(26,58,92,.25);position:sticky;top:0;z-index:200;}
        .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
        .back-btn{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);color:#fff;padding:7px 10px;border-radius:8px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;}
        .back-btn:hover{background:rgba(255,255,255,.24);}
        .back-btn .icon{width:1.05em;height:1.05em;}
        .topbar-title{min-width:0;}
        .topbar-title h1{font-size:.98rem;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .topbar-title p{font-size:.72rem;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
        .conn-badge{font-size:.85rem;line-height:1;font-weight:700;color:#6b7a8d;flex-shrink:0;transition:color .2s;}
        .conn-badge.online{color:#7dffd0;}
        .conn-badge.error{color:#ffd0cb;}
        .icon-btn{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);color:#fff;cursor:pointer;transition:background .2s;text-decoration:none;}
        .icon-btn:hover{background:rgba(255,255,255,.24);}
        .icon-btn .icon{width:1.1em;height:1.1em;}

        .page{padding:20px;max-width:1300px;margin:0 auto;}

        /* ── FILTRE DE PÉRIODE : segmenté + « Personnalisé » séparé ── */
        .period-row{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;align-items:center;}
        .period-seg{display:flex;background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:3px;gap:2px;}
        .period-btn{padding:7px 14px;border:none;border-radius:17px;background:transparent;font-family:inherit;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;}
        .period-btn:hover{color:var(--primary);}
        .period-btn.active{background:var(--primary);color:#fff;}
        .period-custom-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--card-bg);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
        .period-custom-btn:hover,.period-custom-btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-bg);}
        .period-custom-btn .icon{width:1.1em;height:1.1em;}

        .custom-range-bar{display:none;align-items:flex-end;gap:12px;flex-wrap:wrap;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0;}
        .custom-range-bar.visible{display:flex;}
        .custom-range-bar .fg{display:flex;flex-direction:column;gap:4px;}
        .custom-range-bar label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
        .custom-range-bar input[type=date]{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.82rem;color:var(--text);background:#fafbfc;}
        .custom-range-bar input[type=date]:focus{outline:none;border-color:var(--primary);}
        .btn-apply-range{padding:9px 18px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .2s;}
        .btn-apply-range:hover{background:var(--primary-light);}
        .custom-range-hint{font-size:.72rem;color:var(--muted);flex-basis:100%;}

        .periode-range{font-size:.82rem;color:var(--muted);font-weight:600;margin:10px 0 18px;padding-left:2px;display:flex;align-items:center;gap:6px;}
        .periode-range .icon{width:1em;height:1em;}

        .sect-title{font-size:.76rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:22px 0 10px;display:flex;align-items:center;gap:7px;}
        .sect-title .icon{width:1em;height:1em;}
        .sect-title:first-of-type{margin-top:4px;}

        /* ── RÉSUMÉ FINANCIER ── */
        .kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
        .kpi-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 2px 6px rgba(0,0,0,.03);}
        .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
        .kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .kpi-icon .icon{width:1.05em;height:1.05em;}
        .kpi-card.green .kpi-icon{background:var(--accent-bg);color:var(--accent-dark);}
        .kpi-card.red .kpi-icon{background:var(--danger-bg);color:var(--danger);}
        .kpi-delta{font-size:.72rem;font-weight:800;display:inline-flex;align-items:center;gap:2px;padding:3px 7px;border-radius:10px;white-space:nowrap;}
        .kpi-delta .icon{width:.85em;height:.85em;}
        .kpi-delta.up{background:var(--accent-bg);color:var(--accent-dark);}
        .kpi-delta.down{background:var(--danger-bg);color:var(--danger);}
        .kpi-label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:10px;}
        .kpi-val{font-size:1.28rem;font-weight:800;color:var(--primary);margin-top:3px;line-height:1.15;}
        .kpi-sub{font-size:.7rem;color:var(--muted);margin-top:2px;}

        .solde-card{background:var(--card-bg);border:1.5px solid var(--accent);border-left:5px solid var(--accent);border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:8px;}
        .solde-card.negatif{border-color:var(--danger);border-left-color:var(--danger);}
        .solde-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
        .solde-label{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:7px;}
        .solde-label .icon{width:1.1em;height:1.1em;color:var(--accent);}
        .solde-card.negatif .solde-label .icon{color:var(--danger);}
        .solde-val{font-size:1.9rem;font-weight:800;color:var(--accent);line-height:1.1;margin-top:6px;}
        .solde-card.negatif .solde-val{color:var(--danger);}
        .solde-expl{font-size:.8rem;color:var(--muted);margin-top:6px;font-weight:600;}
        .solde-expl strong{color:var(--danger);font-weight:800;}
        .solde-card:not(.negatif) .solde-expl strong{color:var(--accent-dark);}

        /* ── ACTION PRINCIPALE ── */
        .btn-add-expense{width:100%;padding:13px;border:none;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:800;background:var(--gold);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;margin:18px 0 4px;box-shadow:0 2px 10px rgba(214,137,16,.25);}
        .btn-add-expense:hover{background:var(--gold-dark);transform:translateY(-1px);}
        .btn-add-expense .icon{width:1.1em;height:1.1em;}

        /* ── PANELS ── */
        .panel{background:var(--card-bg);border-radius:14px;border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.03);margin-bottom:20px;overflow:hidden;}
        .panel-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
        .panel-head h2{font-size:.92rem;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px;}
        .panel-head h2 .icon{width:1.05em;height:1.05em;color:var(--muted);}
        .panel-head p{font-size:.76rem;color:var(--muted);margin-top:2px;}
        .panel-body{padding:20px;}

        .btn-secondary-sm{padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;background:#fafbfc;color:var(--primary);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:all .2s;}
        .btn-secondary-sm:hover{border-color:var(--primary);background:var(--primary-bg);}
        .btn-secondary-sm .icon{width:1em;height:1em;}

        /* ── RÉPARTITION PAR CATÉGORIE ── */
        .cat-list{display:flex;flex-direction:column;gap:10px;}
        .cat-row{display:flex;align-items:center;gap:10px;font-size:.83rem;}
        .cat-row .cr-nom{flex:0 0 38%;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .cat-bar{flex:1;height:10px;background:#eef2f6;border-radius:5px;overflow:hidden;}
        .cat-bar span{display:block;height:100%;background:var(--danger);border-radius:5px;}
        .cat-row .cr-val{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
        .cat-row .cr-pct{color:var(--muted);font-weight:700;font-size:.76rem;margin-left:4px;}
        .cat-single-note{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:12px;}
        .cat-single-note .icon{width:1.1em;height:1.1em;flex-shrink:0;}

        /* ── EMPTY STATE ── */
        .empty-state{text-align:center;color:var(--muted);font-size:.86rem;padding:30px 20px;}
        .empty-state .icon{width:1.8rem;height:1.8rem;color:var(--border);display:block;margin:0 auto 10px;}

        /* ── JOURNAL — TABLEAU (desktop) ── */
        .tbl-wrap{overflow-x:auto;min-width:0;max-width:100%;}
        table.data{width:100%;border-collapse:collapse;font-size:.84rem;}
        table.data th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:2px solid var(--border);white-space:nowrap;}
        table.data td{padding:11px 12px;border-bottom:1px solid #eef2f6;}
        table.data tbody tr:hover{background:#fafbfc;}
        table.data .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap;color:var(--danger);}
        .cat-tag{display:inline-block;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:12px;background:var(--blue-bg);color:var(--primary);white-space:nowrap;}

        /* ── JOURNAL — CARTES (mobile) ── */
        .txn-cards{display:none;flex-direction:column;gap:10px;}
        .txn-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:13px 15px;box-shadow:0 1px 4px rgba(0,0,0,.03);}
        .txn-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
        .txn-card-nom{font-size:.9rem;font-weight:700;color:var(--text);}
        .txn-card-cat{font-size:.76rem;color:var(--muted);margin-top:2px;}
        .txn-card-montant{font-size:1.02rem;font-weight:800;color:var(--danger);white-space:nowrap;flex-shrink:0;}
        .txn-card-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid #f0f2f5;}
        .txn-card-date{font-size:.74rem;color:var(--muted);}

        /* ── MODALE : NOUVELLE DÉPENSE ── */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,32,.55);z-index:500;align-items:flex-end;justify-content:center;padding:0;}
        .modal-overlay.visible{display:flex;}
        .modal-box{background:var(--card-bg);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);}
        .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border);}
        .modal-head h3{font-size:1rem;color:var(--primary);font-weight:800;display:flex;align-items:center;gap:8px;}
        .modal-head h3 .icon{width:1.1em;height:1.1em;color:var(--gold);}
        .modal-close{background:none;border:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);flex-shrink:0;}
        .modal-body{padding:18px 20px;}
        @media(min-width:600px){
            .modal-overlay{align-items:center;}
            .modal-box{border-radius:16px;}
        }

        /* ── FORMULAIRE ── */
        .form-group{margin-bottom:13px;}
        .form-group label{display:block;font-size:.73rem;font-weight:700;color:var(--primary);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
        .form-control{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.88rem;font-family:inherit;color:var(--text);background:#fafbfc;}
        .form-control:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,137,16,.12);background:#fff;}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
        .btn-primary{width:100%;padding:12px;border:none;border-radius:8px;font-family:inherit;font-size:.92rem;font-weight:700;background:var(--gold);color:#fff;cursor:pointer;transition:all .2s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;}
        .btn-primary:hover{background:var(--gold-dark);}
        .btn-primary:disabled{opacity:.6;cursor:progress;}
        .btn-primary .icon{width:1.05em;height:1.05em;}

        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--primary);color:#fff;padding:12px 22px;border-radius:10px;font-size:.86rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .28s;z-index:600;}
        .toast.show{transform:translateX(-50%) translateY(0);}
        .toast.err{background:var(--danger);}
        ::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}

        @media(max-width:900px){
            .txn-cards{display:flex;}
            .tbl-wrap{display:none;}
        }
        @media(max-width:600px){
            .page{padding:12px;}
            .form-row{grid-template-columns:1fr;}
            .topbar{padding:0 12px;}
            .period-btn{padding:6px 10px;font-size:.76rem;}
        }
    </style>
</head>
<body>

<nav class="topbar">
    <div class="topbar-left">
        <a href="../accueil/menu_admin.html" class="back-btn" id="back-btn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            <span class="label-full">Menu</span>
        </a>
        <div class="topbar-title">
            <h1>Dépenses &amp; Bilan</h1>
            <p>Charges du poste · Solde net</p>
        </div>
    </div>
    <div class="topbar-right">
        <div class="conn-badge" id="conn-badge">●</div>
        <a href="rapports.html" class="icon-btn" title="Rapports d'activité" aria-label="Rapports d'activité">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        </a>
        <button type="button" class="icon-btn" onclick="deconnexion()" title="Déconnexion" aria-label="Déconnexion">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
    </div>
</nav>

<div class="page">

    <!-- ══ 1. PÉRIODE ══ -->
    <div class="period-row">
        <div class="period-seg" id="period-tabs">
            <button class="period-btn" data-p="jour">Jour</button>
            <button class="period-btn" data-p="semaine">Semaine</button>
            <button class="period-btn active" data-p="mois">Mois</button>
            <button class="period-btn" data-p="trimestre">Trimestre</button>
            <button class="period-btn" data-p="annee">Année</button>
        </div>
        <button type="button" class="period-custom-btn" id="period-custom-btn" title="Période personnalisée" aria-label="Période personnalisée">
            <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
        </button>
    </div>

    <div class="custom-range-bar" id="custom-range-bar">
        <div class="fg">
            <label for="date-debut">Du</label>
            <input type="date" id="date-debut">
        </div>
        <div class="fg">
            <label for="date-fin">Au (facultatif)</label>
            <input type="date" id="date-fin">
        </div>
        <button class="btn-apply-range" id="btn-apply-range">Appliquer</button>
        <span class="custom-range-hint">Laissez « Au » vide (ou identique à « Du ») pour consulter une seule date.</span>
    </div>

    <div class="periode-range" id="periode-range">
        <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
        <span id="periode-range-txt">—</span>
    </div>

    <!-- ══ 2. RÉSUMÉ FINANCIER ══ -->
    <div class="kpi-row">
        <div class="kpi-card green">
            <div class="kpi-top">
                <div class="kpi-icon"><svg class="icon" viewBox="0 0 24 24"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg></div>
                <span class="kpi-delta" id="rec-delta" hidden></span>
            </div>
            <div class="kpi-label">Recettes</div>
            <div class="kpi-val" id="b-recettes">—</div>
            <div class="kpi-sub" id="rec-detail">—</div>
        </div>
        <div class="kpi-card red">
            <div class="kpi-top">
                <div class="kpi-icon"><svg class="icon" viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg></div>
                <span class="kpi-delta" id="dep-delta" hidden></span>
            </div>
            <div class="kpi-label">Dépenses</div>
            <div class="kpi-val" id="b-depenses">—</div>
            <div class="kpi-sub" id="dep-detail">—</div>
        </div>
    </div>

    <div class="solde-card" id="card-solde">
        <div class="solde-top">
            <div class="solde-label">
                <svg class="icon" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                Solde net du poste
            </div>
        </div>
        <div class="solde-val" id="b-solde">—</div>
        <div class="solde-expl" id="solde-expl"></div>
    </div>

    <button type="button" class="btn-add-expense" id="btn-open-form">
        <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Ajouter une dépense
    </button>

    <!-- ══ 3. ANALYSE DES DÉPENSES ══ -->
    <div class="sect-title">
        <svg class="icon" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        Analyse des dépenses
    </div>
    <div class="panel">
        <div class="panel-head">
            <div>
                <h2>Répartition par catégorie</h2>
                <p id="cat-periode">—</p>
            </div>
        </div>
        <div class="panel-body"><div id="cat-container" class="cat-list"></div></div>
    </div>

    <!-- ══ 4. TRANSACTIONS ══ -->

<script type="module">
import { db, auth } from '../firebase-config.js';

// Le rôle est cherché dans sessionStorage puis, à défaut, dans localStorage

onAuthStateChanged(auth, user => {

});

};
window.addEventListener('storage', (e) => {

// ── Bibliothèque d'icônes SVG partagée (trait 2px cohérent) ──────
const ICON_BOX   = '<svg class="icon" viewBox="0 0 24 24"><path d="m16.5 9.4-9-5.19"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>';
const ICON_UP    = '<svg class="icon" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>';
const ICON_DOWN  = '<svg class="icon" viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>';
const ICON_INFO  = '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';

// ── MODALE FORMULAIRE ────────────────────────────

const CATEGORIES = [
    'Achat de médicaments', 'Matériel médical', 'Fournitures de bureau',

// ── Champ MONTANT : espace tous les 3 chiffres pendant la saisie ─────
const montantInput = document.getElementById('d-montant');
const groupeChiffres = s => String(s).replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const montantValeur = () => parseInt(montantInput.value.replace(/\s/g, ''), 10);

// ── Justificatif : visible pour toutes les catégories (facultatif),

const inpJustif  = document.getElementById('d-justificatif');

majJustificatif();

function toast(msg, type = 'ok') {
    const el = document.getElementById('toast');
    el.textContent = (type === 'ok' ? '✓ ' : '✗ ') + msg;
    el.className = 'toast show ' + type;
    setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Date compacte pour les cartes mobiles : « 01 sept. 2026 · 12:00 » ──
const MOIS_ABBR = ['jan.','fév.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function dateCompacte(ts) {
    const d = new Date(ts);
    const jour = String(d.getDate()).padStart(2, '0');
    const heure = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    return `${jour} ${MOIS_ABBR[d.getMonth()]} ${d.getFullYear()} · ${heure}`;
}

// ── ÉTAT ────────────────────────────────────────
const DEPENSES_NODE = 'db_depenses';
const depenseRef = ref(db, DEPENSES_NODE);
const ticketRef  = ref(db, 'ticket_dbase');
const medRef     = ref(db, 'vente_medicaments');

let allDepenses = [], allTickets = [], allVentes = [];
let loadedD = false, loadedT = false, loadedM = false;
let periode = 'mois';

let customDebut = null, customFin = null, customLabel = '';

const PERIOD_ORDER = ['jour', 'semaine', 'mois', 'trimestre', 'annee', 'tout'];

function statsFor(p) {
    const dep = allDepenses.filter(x => dansPeriode(x._ts, p));
    const tk  = allTickets.filter(x => dansPeriode(x._ts, p));
    const md  = allVentes.filter(x => dansPeriode(x._ts, p));
    const recettes = totalTickets(tk) + totalVentes(md);
    const depenses = totalDepenses(dep);
    return { recettes, depenses, solde: recettes - depenses,
             nbDep: dep.length, nbTk: tk.length, nbMd: md.length };
}

// ── Période précédente équivalente (pour l'indicateur d'évolution) ──
// Renvoie [début, fin[ en millisecondes, ou null si la comparaison n'a
// pas de sens (période personnalisée).
function bornesPrecedente(p) {
    const n = new Date();
    switch (p) {
        case 'jour': {
            const fin = new Date(n); fin.setHours(0, 0, 0, 0);
            return [fin.getTime() - 86400000, fin.getTime()];
        }
        case 'semaine': {
            const dow = n.getDay();
            const lundi = new Date(n); lundi.setHours(0, 0, 0, 0);
            lundi.setDate(n.getDate() - (dow === 0 ? 6 : dow - 1));
            return [lundi.getTime() - 7 * 86400000, lundi.getTime()];
        }
        case 'mois': {
            const debutMois = new Date(n.getFullYear(), n.getMonth(), 1).getTime();
            const debutPrec = new Date(n.getFullYear(), n.getMonth() - 1, 1).getTime();
            return [debutPrec, debutMois];
        }
        case 'trimestre': {
            const qm = Math.floor(n.getMonth() / 3) * 3;
            const debutQ = new Date(n.getFullYear(), qm, 1).getTime();
            const debutPrecQ = new Date(n.getFullYear(), qm - 3, 1).getTime();
            return [debutPrecQ, debutQ];
        }
        case 'annee': {
            const debutAn = new Date(n.getFullYear(), 0, 1).getTime();
            const debutPrecAn = new Date(n.getFullYear() - 1, 0, 1).getTime();
            return [debutPrecAn, debutAn];
        }
        default: return null;
    }
}
function statsPrecedente(p) {
    const b = bornesPrecedente(p);
    if (!b) return null;
    const [debut, fin] = b;
    const dans = x => x._ts >= debut && x._ts < fin;
    const dep = allDepenses.filter(dans), tk = allTickets.filter(dans), md = allVentes.filter(dans);
    return { recettes: totalTickets(tk) + totalVentes(md), depenses: totalDepenses(dep) };
}

const allLoaded = () => loadedD && loadedT && loadedM;

function checkLoaded() {
    const badge = document.getElementById('conn-badge');
    if (allLoaded()) { badge.classList.remove('error'); badge.classList.add('online'); }
}

function onReadError(label) {
    return err => {
        console.error('[db_depenses] lecture', label, err);
        const badge = document.getElementById('conn-badge');
        badge.classList.remove('online'); badge.classList.add('error');
        badge.title = 'Hors ligne / accès refusé';
        render();
    };
}

onValue(depenseRef, snap => {
    allDepenses = [];
    snap.forEach(c => { allDepenses.push({ _key: c.key, _ts: c.val().date_ts || getSafeTs(c.val()), ...c.val() }); });
    allDepenses.sort((a, b) => b._ts - a._ts);
    loadedD = true; render(); checkLoaded();
}, onReadError('depenses'));
onValue(ticketRef, snap => {
    allTickets = [];
    snap.forEach(c => { allTickets.push({ _ts: getSafeTs(c.val()), ...c.val() }); });
    loadedT = true; render(); checkLoaded();
}, onReadError('tickets'));
onValue(medRef, snap => {
    allVentes = [];
    snap.forEach(c => { allVentes.push({ _ts: getSafeTs(c.val()), ...c.val() }); });
    loadedM = true; render(); checkLoaded();
}, onReadError('ventes'));

// ── SÉLECTEUR DE PÉRIODE ────────────────────────
document.getElementById('period-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.period-btn');
    if (!btn) return;
    periode = btn.dataset.p;
    document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('period-custom-btn').classList.remove('active');
    document.getElementById('custom-range-bar').classList.remove('visible');
    render();
});
document.getElementById('period-custom-btn').addEventListener('click', () => {
    const bar = document.getElementById('custom-range-bar');
    const open = bar.classList.toggle('visible');
    document.getElementById('period-custom-btn').classList.toggle('active', open);
});

function formatISOtoFR(iso) {
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
}

function appliquerPlagePersonnalisee() {
    const dEl = document.getElementById('date-debut');
    const fEl = document.getElementById('date-fin');
    let dStr = dEl.value;
    let fStr = fEl.value || dStr;
    if (!dStr) { toast('Choisissez au moins une date de début.', 'err'); return; }
    if (!fStr) fStr = dStr;
    if (fStr < dStr) { [dStr, fStr] = [fStr, dStr]; }
    dEl.value = dStr; fEl.value = fStr;

    const [ya, ma, da] = dStr.split('-').map(Number);
    const [yb, mb, dbb] = fStr.split('-').map(Number);
    customDebut = new Date(ya, ma - 1, da, 0, 0, 0, 0).getTime();
    customFin   = new Date(yb, mb - 1, dbb, 23, 59, 59, 999).getTime();
    customLabel = (dStr === fStr) ? `Le ${formatISOtoFR(dStr)}` : `Du ${formatISOtoFR(dStr)} au ${formatISOtoFR(fStr)}`;

    periode = 'personnalise';
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('period-custom-btn').classList.add('active');
    render();
}
document.getElementById('btn-apply-range').addEventListener('click', appliquerPlagePersonnalisee);
['date-debut', 'date-fin'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') appliquerPlagePersonnalisee();
    });
});

function libelleCourant() {
    if (periode === 'personnalise') return customLabel || 'Choisissez une plage de dates ci-dessus';
    return PERIODES[periode].label;
}
function libelleDetailCourant() {
    if (periode === 'personnalise') return customLabel || 'Choisissez une plage de dates ci-dessus';
    return libellePeriode(periode);
}
function courtCourant() {
    return periode === 'personnalise' ? 'Plage personnalisée' : PERIODES[periode].court;
}

const filtre = list => list.filter(x => {
    if (periode === 'personnalise') return customDebut != null && x._ts >= customDebut && x._ts <= customFin;
    return dansPeriode(x._ts, periode);
});

// ── RENDU ───────────────────────────────────────
function render() {
    if (!loadedD) {
        document.getElementById('dep-table').innerHTML = `<div class="empty-state">${ICON_BOX}<p>Chargement des dépenses…</p></div>`;
        document.getElementById('dep-cards').innerHTML = '';
        document.getElementById('cat-container').innerHTML = `<div class="empty-state">${ICON_BOX}<p>Chargement…</p></div>`;
        return;
    }

    const dep = filtre(allDepenses), tk = filtre(allTickets), md = filtre(allVentes);
    const recettes = totalTickets(tk) + totalVentes(md);
    const depenses = totalDepenses(dep);
    const solde = recettes - depenses;

    document.getElementById('b-recettes').textContent = fcfa(recettes);
    document.getElementById('rec-detail').textContent = `${tk.length} ticket(s) · ${md.length} vente(s)`;
    document.getElementById('b-depenses').textContent = fcfa(depenses);
    document.getElementById('dep-detail').textContent = `${dep.length} opération(s)`;
    document.getElementById('b-solde').textContent = (solde < 0 ? '– ' : '') + fcfa(Math.abs(solde));
    document.getElementById('card-solde').classList.toggle('negatif', solde < 0);

    // Explication du solde : jamais un simple nombre négatif sans contexte.
    const explEl = document.getElementById('solde-expl');
    if (solde < 0) {
        const pct = recettes > 0 ? Math.round(depenses / recettes * 100) : null;
        explEl.innerHTML = `<strong>Déficit de ${esc(fcfa(Math.abs(solde)))}</strong>` +
            (pct != null ? ` — les dépenses représentent ${pct} % des recettes de la période.` : ' — aucune recette sur cette période.');
    } else if (recettes > 0 || depenses > 0) {
        const pct = recettes > 0 ? Math.round(solde / recettes * 100) : 100;
        explEl.innerHTML = `<strong>Excédent de ${esc(fcfa(solde))}</strong> — ${pct} % des recettes conservés sur cette période.`;
    } else {
        explEl.textContent = 'Aucune recette ni dépense sur cette période.';
    }

    // Évolution vs période précédente équivalente (non disponible en
    // période personnalisée).
    const prev = statsPrecedente(periode);
    renderDelta('rec-delta', prev?.recettes, recettes);
    renderDelta('dep-delta', prev?.depenses, depenses, true);

    const lbl = libelleCourant();
    document.getElementById('periode-range-txt').textContent = libelleDetailCourant();
    document.getElementById('cat-periode').textContent = lbl;
    document.getElementById('jrn-periode').textContent = libelleDetailCourant();

    renderJournal(dep);
    renderCategories(dep, depenses);
}

// inverse=true : pour les dépenses, une hausse est défavorable (rouge)
// et une baisse favorable (verte) — l'inverse des recettes.
function renderDelta(id, prevVal, curVal, inverse = false) {
    const el = document.getElementById(id);
    if (prevVal == null || prevVal <= 0) { el.hidden = true; return; }
    const pct = Math.round((curVal - prevVal) / prevVal * 100);
    if (pct === 0) { el.hidden = true; return; }
    const hausse = pct > 0;
    const favorable = inverse ? !hausse : hausse;
    el.hidden = false;
    el.className = 'kpi-delta ' + (favorable ? 'up' : 'down');
    el.innerHTML = (hausse ? ICON_UP : ICON_DOWN) + `<span>${hausse ? '+' : ''}${pct}%</span>`;
    el.title = 'Par rapport à la période précédente';
}

function msgVide(defaut) {
    if (periode === 'personnalise' && customDebut == null) {
        return 'Choisissez une plage de dates ci-dessus, puis cliquez sur « Appliquer ».';
    }
    return defaut;
}

function renderJournal(dep) {
    const tblHost = document.getElementById('dep-table');
    const cardHost = document.getElementById('dep-cards');
    if (!dep.length) {
        const empty = `<div class="empty-state">${ICON_BOX}<p>${esc(msgVide('Aucune dépense enregistrée pour le moment.'))}</p></div>`;
        tblHost.innerHTML = empty;
        cardHost.innerHTML = empty;
        return;
    }
    const total = totalDepenses(dep);

    tblHost.innerHTML = `<table class="data">
        <thead><tr>
            <th>Date</th><th>Libellé</th><th>Catégorie</th>
            <th class="num">Montant</th>
        </tr></thead>
        <tbody>${dep.map(d => `<tr>
            <td style="white-space:nowrap;color:var(--muted);font-size:.8rem;">${esc(dateHeure(d._ts))}</td>
            <td style="font-weight:600;">${esc(d.libelle)}</td>
            <td><span class="cat-tag">${esc(d.categorie)}</span></td>
            <td class="num">− ${esc(fcfa(d.montant))}</td>
        </tr>`).join('')}</tbody>
        <tfoot><tr>
            <td colspan="3" style="font-weight:800;padding-top:14px;">TOTAL DES DÉPENSES</td>
            <td class="num" style="font-size:1rem;padding-top:14px;">${esc(fcfa(total))}</td>
        </tr></tfoot>
    </table>`;

    cardHost.innerHTML = dep.map(d => `
        <div class="txn-card">
            <div class="txn-card-top">
                <div>
                    <div class="txn-card-nom">${esc(d.libelle)}</div>
                    <div class="txn-card-cat"><span class="cat-tag">${esc(d.categorie)}</span></div>
                </div>
                <div class="txn-card-montant">− ${esc(fcfa(d.montant))}</div>
            </div>
            <div class="txn-card-bottom">
                <span class="txn-card-date">${esc(dateCompacte(d._ts))}</span>
            </div>
        </div>`).join('');
}

// Pas de suppression ici : la correction / suppression d'une dépense se
// fait uniquement par l'administration, dans Planification & Rapports.

function renderCategories(dep, total) {
    const c = document.getElementById('cat-container');
    const cats = parCategorie(dep);
    if (!cats.length) { c.innerHTML = `<div class="empty-state">${ICON_BOX}<p>Rien à répartir sur cette période.</p></div>`; return; }
    const max = cats[0].montant || 1;
    c.innerHTML = cats.map(k => `
        <div class="cat-row">
            <span class="cr-nom" title="${esc(k.nom)}">${esc(k.nom)}</span>
            <span class="cat-bar"><span style="width:${Math.round(k.montant / max * 100)}%"></span></span>
            <span class="cr-val">${esc(fcfa(k.montant))}<span class="cr-pct">(${total ? Math.round(k.montant / total * 100) : 0} %)</span></span>
        </div>`).join('') +
        (cats.length === 1
            ? `<div class="cat-single-note">${ICON_INFO}<span>Une seule catégorie de dépense sur cette période.</span></div>`
            : '');
}

// ── SAISIE ──────────────────────────────────────
const form = document.getElementById('dep-form');
const submitBtn = document.getElementById('submit-btn');
const submitBtnLabel = document.getElementById('submit-btn-label');

form.addEventListener('submit', async e => {
    e.preventDefault();
    const categorie = document.getElementById('d-categorie').value;
    const montant = montantValeur();
    const justificatif = inpJustif.value.trim();
    const dateStr = document.getElementById('d-date').value;

    if (!categorie || !dateStr) { toast('Tous les champs obligatoires doivent être remplis.', 'err'); return; }
    if (!Number.isFinite(montant) || montant <= 0) { toast('Le montant doit être un nombre positif.', 'err'); return; }
    if (categorie === 'Autre' && !justificatif) { toast('Précisez le justificatif pour la catégorie « Autre ».', 'err'); return; }
    if (dateStr > new Date().toISOString().slice(0, 10)) { toast('La date ne peut pas être dans le futur.', 'err'); return; }

    if (allLoaded()) {
        const soldeDispo = totalTickets(allTickets) + totalVentes(allVentes) - totalDepenses(allDepenses);
        if (montant > soldeDispo) {
            toast(`Solde insuffisant : cette dépense (${fcfa(montant)}) dépasse le solde disponible (${fcfa(Math.max(0, soldeDispo))}).`, 'err');
            return;
        }
    }

    const libelle = justificatif || categorie;

    const [y, m, d] = dateStr.split('-').map(Number);
    const ts = new Date(y, m - 1, d, 12, 0, 0).getTime();

    const data = {
        libelle, categorie, montant,
        date_ts: ts,
        date: new Date(ts).toLocaleDateString('fr-FR'),
        cree_le: Date.now(),
        cree_par: auth.currentUser?.email || 'inconnu',
    };

    submitBtn.disabled = true; submitBtnLabel.textContent = 'Enregistrement…';
    try {
        await push(depenseRef, data);
        form.reset();
        document.getElementById('d-date').value = new Date().toISOString().slice(0, 10);
        majJustificatif();
        toast('Dépense enregistrée.', 'ok');
        closeFormModal();
    } catch (err) {
        console.error(err);
        toast("Échec de l'enregistrement : " + err.message, 'err');
    } finally {
        submitBtn.disabled = false; submitBtnLabel.textContent = 'Enregistrer la dépense';
    }
});

// ── EXPORT PDF ──────────────────────────────────
document.getElementById('btn-pdf').addEventListener('click', () => {
    const dep = filtre(allDepenses), tk = filtre(allTickets), md = filtre(allVentes);
    const rTk = totalTickets(tk), rMd = totalVentes(md);
    const recettes = rTk + rMd, depenses = totalDepenses(dep);
    const solde = recettes - depenses;

    exporterPDF({
        titre: 'Bilan financier — Dépenses et recettes',
        periodeLabel: libelleDetailCourant(),
        meta: [
            { k: 'Période', v: courtCourant() },
            { k: 'Consultations', v: `${tk.length} ticket(s)` },
            { k: 'Ventes pharmacie', v: `${md.length} vente(s)` },
            { k: 'Dépenses', v: `${dep.length} opération(s)` },
        ],
        resume: [
            { label: 'Recettes consultations', valeur: fcfa(rTk) },
            { label: 'Recettes pharmacie', valeur: fcfa(rMd) },
            { label: 'Total des recettes', valeur: fcfa(recettes), type: 'positif' },
            { label: 'Total des dépenses', valeur: fcfa(depenses), type: 'negatif' },
            { label: 'Solde net du poste', valeur: (solde < 0 ? '– ' : '') + fcfa(Math.abs(solde)),
              type: solde < 0 ? 'negatif' : 'positif' },
        ],
        sections: [
            {
                titre: 'Synthèse par période',
                cols: [
                    { t: 'Période', k: 'periode', w: '28%' },
                    { t: 'Recettes', k: 'recettes', num: true, w: '24%' },
                    { t: 'Dépenses', k: 'depenses', num: true, w: '24%' },
                    { t: 'Solde net', k: 'solde', num: true, w: '24%' },
                ],
                rows: PERIOD_ORDER.map(p => {
                    const s = statsFor(p);
                    return {
                        periode: PERIODES[p].court,
                        recettes: fcfa(s.recettes),
                        depenses: fcfa(s.depenses),
                        solde: (s.solde < 0 ? '– ' : '') + fcfa(Math.abs(s.solde)),
                    };
                }),
                vide: 'Aucune donnée à présenter.',
            },
            {
                titre: 'Journal des dépenses',
                cols: [
                    { t: 'Date', k: 'date', w: '18%' },
                    { t: 'Libellé', k: 'libelle', w: '40%' },
                    { t: 'Catégorie', k: 'cat', w: '27%' },
                    { t: 'Montant', k: 'montant', num: true, w: '15%' },
                ],
                rows: dep.map(d => ({
                    date: new Date(d._ts).toLocaleDateString('fr-FR'),
                    libelle: d.libelle, cat: d.categorie,
                    montant: fcfa(d.montant),
                })),
                totalLabel: 'TOTAL DES DÉPENSES',
                totalValue: fcfa(depenses),
                vide: 'Aucune dépense enregistrée.',
            },
            {
                titre: 'Répartition par catégorie',
                cols: [
                    { t: 'Catégorie', k: 'nom', w: '50%' },
                    { t: 'Opérations', k: 'nb', num: true, w: '20%' },
                    { t: 'Montant', k: 'montant', num: true, w: '15%' },
                    { t: 'Part', k: 'part', num: true, w: '15%' },
                ],
                rows: parCategorie(dep).map(k => ({
                    nom: k.nom, nb: k.nb, montant: fcfa(k.montant),
                    part: (depenses ? Math.round(k.montant / depenses * 100) : 0) + ' %',
                })),
                totalLabel: 'TOTAL',
                totalValue: fcfa(depenses),
                vide: 'Aucune catégorie à présenter.',
            },
        ],
        note: solde < 0
            ? "Attention : le total des dépenses excède les recettes encaissées."
            : "Le solde net correspond à l'ensemble des recettes encaissées diminué de toutes les dépenses enregistrées.",
    });
});

window.addEventListener('beforeunload', () => { off(depenseRef); off(ticketRef); off(medRef); });
</script>
