<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dépenses &amp; Bilan – Poste de Santé de Diandioly</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rapport-print.css">
    <style>
        :root{
            --primary:#1a3a5c;--primary-light:#274e74;--accent:#0ea472;--accent-bg:#e6f7f1;
            --gold:#d68910;--gold-dark:#b87309;--gold-bg:#fef9ec;
            --danger:#c0392b;--danger-bg:#fdf1f0;
            --purple:#7b5ea7;--purple-bg:#f0ebf8;--blue-bg:#e8f0f8;
            --bg:#f0f4f8;--card-bg:#fff;--text:#1e2a38;--muted:#6b7a8d;--border:#d8e0e8;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        html,body{max-width:100%;overflow-x:hidden;overflow-x:clip;}
        body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:clip;}

        .topbar{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(26,58,92,.18);position:sticky;top:0;z-index:100;}
        .topbar-left{display:flex;align-items:center;gap:12px;}
        .back-btn{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:#fff;padding:7px 14px;border-radius:8px;font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
        .back-btn:hover{background:rgba(255,255,255,.22);}
        .topbar h1{font-size:1.05rem;font-weight:700;}
        .topbar p{font-size:.72rem;opacity:.75;}
        .conn-badge{background:rgba(14,164,114,.2);border:1px solid rgba(14,164,114,.4);color:#7dffd0;font-size:.75rem;font-weight:700;padding:5px 12px;border-radius:20px;}

        .page{padding:24px;max-width:1400px;margin:0 auto;}

        /* ── BILAN ── */
        .bilan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px;}
        .bilan-card{border-radius:12px;padding:20px 22px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;}
        .bilan-card .bc-label{font-size:.74rem;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.5px;}
        .bilan-card .bc-sub{font-size:.72rem;opacity:.7;margin-top:2px;}
        .bilan-card .bc-val{font-size:1.55rem;font-weight:800;line-height:1.15;margin-top:6px;}
        .bilan-card .bc-icon{font-size:1.9rem;opacity:.45;}
        .bc-recettes{background:linear-gradient(135deg,var(--accent),#0b8a5f);}
        .bc-depenses{background:linear-gradient(135deg,#c0392b,#96271b);}
        .bc-solde{background:linear-gradient(135deg,var(--primary),var(--primary-light));}
        .bc-solde.negatif{background:linear-gradient(135deg,#8e2b20,#5f1a13);}

        /* ── BILAN MULTI-PÉRIODES ── */
        .periods-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:24px;}
        .period-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.03);padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--primary);}
        .pc-head{display:flex;flex-direction:column;gap:2px;}
        .pc-title{font-size:.95rem;font-weight:800;color:var(--primary);}
        .pc-range{font-size:.7rem;color:var(--muted);font-weight:600;}
        .pc-lines{display:flex;flex-direction:column;gap:7px;}
        .pc-line{display:flex;align-items:center;gap:8px;font-size:.86rem;}
        .pc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
        .pc-dot.rec{background:var(--accent);}
        .pc-dot.dep{background:var(--danger);}
        .pc-dot.sol{background:var(--primary);}
        .pc-lbl{flex:1;color:var(--muted);font-weight:600;}
        .pc-val{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
        .pc-line.solde{border-top:1px dashed var(--border);padding-top:8px;margin-top:1px;}
        .pc-line.solde .pc-lbl{color:var(--text);font-weight:700;}
        .pc-line.solde .pc-val{color:var(--accent);}
        .pc-line.solde.neg .pc-dot.sol{background:var(--danger);}
        .pc-line.solde.neg .pc-val{color:var(--danger);}
        .pc-foot{font-size:.7rem;color:var(--muted);border-top:1px solid #eef2f6;padding-top:8px;}

        .main-grid{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start;}
        @media(max-width:1024px){.main-grid{grid-template-columns:1fr;}}
        /* Empêche un enfant de grille (ex. tableau min-width:520px) de forcer
           la colonne au-delà de la largeur de l'écran → plus de débordement. */
        .main-grid>*{min-width:0;}
        .tbl-wrap{min-width:0;max-width:100%;}
        .bilan-grid,.form-row{min-width:0;}

        .panel{background:var(--card-bg);border-radius:14px;border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.03);margin-bottom:24px;overflow:hidden;}
        .panel-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
        .panel-head h2{font-size:.98rem;font-weight:700;color:var(--primary);}
        .panel-head p{font-size:.76rem;color:var(--muted);margin-top:2px;}
        .panel-body{padding:20px;}

        .form-group{margin-bottom:13px;}
        .form-group label{display:block;font-size:.73rem;font-weight:700;color:var(--primary);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
        .form-control{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.88rem;font-family:inherit;color:var(--text);background:#fafbfc;}
        .form-control:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,137,16,.12);background:#fff;}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
        .btn-primary{width:100%;padding:12px;border:none;border-radius:8px;font-family:inherit;font-size:.92rem;font-weight:700;background:var(--gold);color:#fff;cursor:pointer;transition:all .2s;margin-top:6px;}
        .btn-primary:hover{background:var(--gold-dark);}
        .btn-primary:disabled{opacity:.6;cursor:progress;}

        .btn-export{padding:10px 16px;border:none;border-radius:8px;font-family:inherit;font-size:.84rem;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:7px;}
        .btn-export:hover{background:var(--primary-light);}

        .tbl-wrap{overflow-x:auto;}
        table.data{width:100%;border-collapse:collapse;font-size:.84rem;}
        table.data th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:2px solid var(--border);white-space:nowrap;}
        table.data td{padding:11px 12px;border-bottom:1px solid #eef2f6;}
        table.data tbody tr:hover{background:#fafbfc;}
        table.data .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;}
        .cat-tag{display:inline-block;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:12px;background:var(--blue-bg);color:var(--primary);white-space:nowrap;}
        .btn-del{background:var(--danger-bg);color:var(--danger);border:1px solid #f5c6c3;border-radius:6px;padding:5px 9px;font-size:.74rem;cursor:pointer;font-family:inherit;font-weight:700;}
        .btn-del:hover{background:var(--danger);color:#fff;}

        .cat-list{display:flex;flex-direction:column;gap:8px;}
        .cat-row{display:flex;align-items:center;gap:10px;font-size:.82rem;}
        .cat-row .cr-nom{flex:0 0 40%;font-weight:600;}
        .cat-bar{flex:1;height:8px;background:#eef2f6;border-radius:5px;overflow:hidden;}
        .cat-bar span{display:block;height:100%;background:var(--danger);border-radius:5px;}
        .cat-row .cr-val{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}

        .empty-state{text-align:center;color:var(--muted);font-size:.86rem;padding:30px 20px;}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--primary);color:#fff;padding:12px 22px;border-radius:10px;font-size:.86rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .28s;z-index:500;}
        .toast.show{transform:translateX(-50%) translateY(0);}
        .toast.err{background:var(--danger);}
        ::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}

        @media(max-width:600px){
            .page{padding:14px;}
            .form-row{grid-template-columns:1fr;}
            /* Barre supérieure : hauteur auto + retour à la ligne */
            .topbar{height:auto;min-height:56px;padding:10px 14px;flex-wrap:wrap;gap:8px;}
            .topbar-left{min-width:0;flex:1 1 auto;}
            .topbar-left>div{min-width:0;}
            .topbar h1{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
            .topbar p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
            .back-btn{flex-shrink:0;}
            /* Cartes bilan : une seule colonne pleine largeur */
            .bilan-grid{grid-template-columns:1fr;}
            .bilan-card{padding:16px 18px;}
            .bilan-card .bc-val{font-size:1.4rem;}
            .panel-body{padding:16px;}
            /* Journal des dépenses : colonnes lisibles + défilement */
            .tbl-wrap table.data{min-width:520px;}
        }
    </style>
</head>
<body>

<nav class="topbar">
    <div class="topbar-left">
        <a href="../accueil/menu_admin.html" class="back-btn">⬅ Menu</a>
        <div>
            <h1>Dépenses &amp; Bilan</h1>
            <p>Charges du poste · Solde net · Export PDF</p>
        </div>
    </div>
    <div class="conn-badge" id="conn-badge">● Synchronisation...</div>
</nav>

<div class="page">

    <!-- BILAN MULTI-PÉRIODES : une carte par période, toutes affichées ensemble -->
    <div class="periods-grid" id="periods-grid"></div>

    <div class="main-grid">

        <!-- COLONNE GAUCHE : SAISIE + RÉPARTITION -->
        <div>
            <div class="panel">
                <div class="panel-head" style="border-left:4px solid var(--gold);">
                    <div>
                        <h2>➕ Nouvelle dépense</h2>
                        <p>Enregistrer une charge du poste</p>
                    </div>
                </div>
                <div class="panel-body">
                    <form id="dep-form">
                        <div class="form-group">
                            <label for="d-libelle">Libellé</label>
                            <input type="text" id="d-libelle" class="form-control" placeholder="Ex. Achat de gants d'examen" required maxlength="90">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="d-categorie">Catégorie</label>
                                <select id="d-categorie" class="form-control" required></select>
                            </div>
                            <div class="form-group">
                                <label for="d-montant">Montant (FCFA)</label>
                                <input type="number" id="d-montant" class="form-control" min="1" step="1" placeholder="0" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="d-date">Date de la dépense</label>
                            <input type="date" id="d-date" class="form-control" required>
                        </div>
                        <button type="submit" class="btn-primary" id="submit-btn">Enregistrer la dépense</button>
                    </form>
                </div>
            </div>

            <div class="panel">
                <div class="panel-head" style="border-left:4px solid var(--danger);">
                    <div>
                        <h2>📊 Répartition par catégorie</h2>
                        <p id="cat-periode">—</p>
                    </div>
                </div>
                <div class="panel-body"><div id="cat-container" class="cat-list"></div></div>
            </div>
        </div>

        <!-- COLONNE DROITE : JOURNAL -->
        <div>
            <div class="panel">
                <div class="panel-head" style="border-left:4px solid var(--primary);">
                    <div>
                        <h2>🧾 Journal des dépenses</h2>
                        <p id="jrn-periode">—</p>
                    </div>
                    <button class="btn-export" id="btn-pdf">📄 Exporter le bilan en PDF</button>
                </div>
                <div class="panel-body">
                    <div class="tbl-wrap"><div id="dep-container"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { db, auth } from '../firebase-config.js';
import { ref, push, onValue, off, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import {
    esc, fmt, fcfa, dateHeure, getSafeTs, PERIODES, dansPeriode, libellePeriode,
    totalTickets, totalVentes, totalDepenses, parCategorie, exporterPDF
} from './rapport-lib.js';

onAuthStateChanged(auth, user => {
    if (!user) { window.location.href = '../index.html'; return; }
    const role = sessionStorage.getItem('userRole');
    // Module réservé au trésorier et à l'administrateur
    if (role !== 'tresorier' && role !== 'admin') {
        window.location.href = '../accueil/menu_caissier.html';
        return;
    }
    // Bouton « Menu » adapté au rôle
    const back = document.querySelector('.topbar .back-btn');
    if (back) back.href = (role === 'tresorier')
        ? '../accueil/menu_tresorier.html'
        : '../accueil/menu_admin.html';
});

const CATEGORIES = [
    'Achat de médicaments', 'Matériel médical', 'Fournitures de bureau',
    'Carburant & transport', 'Électricité & eau', 'Entretien & réparations',
    'Motivation du personnel', 'Frais bancaires', 'Autre',
];

const selCat = document.getElementById('d-categorie');
selCat.innerHTML = CATEGORIES.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
document.getElementById('d-date').value = new Date().toISOString().slice(0, 10);

function toast(msg, type = 'ok') {
    const el = document.getElementById('toast');
    el.textContent = (type === 'ok' ? '✓ ' : '✗ ') + msg;
    el.className = 'toast show ' + type;
    setTimeout(() => el.classList.remove('show'), 3500);
}

// ── ÉTAT ────────────────────────────────────────
// Nouveau nœud vierge : on repart sur « db_depenses_v2 » pour écarter tout
// blocage propre à l'ancien nœud « db_depenses ». Doit rester identique dans
// accueil/menu_tresorier.html (statistiques du jour).
const DEPENSES_NODE = 'db_depenses_v2';
const depenseRef = ref(db, DEPENSES_NODE);
const ticketRef  = ref(db, 'ticket_dbase');
const medRef     = ref(db, 'vente_medicaments');

let allDepenses = [], allTickets = [], allVentes = [];
let loadedD = false, loadedT = false, loadedM = false;

// Toutes les périodes sont affichées ensemble (une carte chacune) :
// plus besoin de sélecteur. Le journal et la répartition portent, eux,
// sur l'ensemble des dépenses enregistrées.
const PERIOD_ORDER = ['jour', 'semaine', 'mois', 'trimestre', 'annee', 'tout'];

// Agrège recettes / dépenses / solde pour une période donnée.
function statsFor(p) {
    const dep = allDepenses.filter(x => dansPeriode(x._ts, p));
    const tk  = allTickets.filter(x => dansPeriode(x._ts, p));
    const md  = allVentes.filter(x => dansPeriode(x._ts, p));
    const recettes = totalTickets(tk) + totalVentes(md);
    const depenses = totalDepenses(dep);
    return { recettes, depenses, solde: recettes - depenses,
             nbDep: dep.length, nbTk: tk.length, nbMd: md.length };
}

const allLoaded = () => loadedD && loadedT && loadedM;

function checkLoaded() {
    const badge = document.getElementById('conn-badge');
    if (allLoaded()) { badge.textContent = '● En direct'; badge.style.color = ''; }
}

// Une erreur de lecture (règles RTDB, réseau) laissait auparavant la page
// muette avec des « 0 FCFA » trompeurs. On l'affiche désormais explicitement.
function onReadError(label) {
    return err => {
        console.error('[db_depenses] lecture', label, err);
        const badge = document.getElementById('conn-badge');
        badge.textContent = '● Hors ligne / accès refusé';
        badge.style.color = '#ffd0cb';
        render();
    };
}

onValue(depenseRef, snap => {
    allDepenses = [];
    snap.forEach(c => allDepenses.push({ _key: c.key, _ts: c.val().date_ts || getSafeTs(c.val()), ...c.val() }));
    allDepenses.sort((a, b) => b._ts - a._ts);
    loadedD = true; render(); checkLoaded();
}, onReadError('depenses'));
onValue(ticketRef, snap => {
    allTickets = [];
    snap.forEach(c => allTickets.push({ _ts: getSafeTs(c.val()), ...c.val() }));
    loadedT = true; render(); checkLoaded();
}, onReadError('tickets'));
onValue(medRef, snap => {
    allVentes = [];
    snap.forEach(c => allVentes.push({ _ts: getSafeTs(c.val()), ...c.val() }));
    loadedM = true; render(); checkLoaded();
}, onReadError('ventes'));

// ── RENDU ───────────────────────────────────────
function render() {
    // Tant que Firebase n'a pas répondu, on n'affiche PAS de « 0 FCFA »
    // trompeur : un état de chargement explicite évite de croire, sur une
    // connexion lente, que les dépenses ont disparu.
    if (!loadedD) {
        document.getElementById('periods-grid').innerHTML =
            `<div class="period-card" style="grid-column:1/-1;align-items:center;text-align:center;color:var(--muted);font-weight:700;">⏳ Chargement des données…</div>`;
        document.getElementById('dep-container').innerHTML =
            `<div class="empty-state">⏳ Chargement des dépenses…</div>`;
        document.getElementById('cat-container').innerHTML =
            `<div class="empty-state">⏳ Chargement…</div>`;
        return;
    }

    // Une carte de bilan par période, toutes affichées ensemble.
    document.getElementById('periods-grid').innerHTML = PERIOD_ORDER.map(p => {
        const s = statsFor(p);
        const neg = s.solde < 0;
        return `<div class="period-card">
            <div class="pc-head">
                <span class="pc-title">${esc(PERIODES[p].court)}</span>
                <span class="pc-range">${esc(libellePeriode(p))}</span>
            </div>
            <div class="pc-lines">
                <div class="pc-line">
                    <span class="pc-dot rec"></span>
                    <span class="pc-lbl">Recettes</span>
                    <span class="pc-val">${esc(fcfa(s.recettes))}</span>
                </div>
                <div class="pc-line">
                    <span class="pc-dot dep"></span>
                    <span class="pc-lbl">Dépenses</span>
                    <span class="pc-val">${esc(fcfa(s.depenses))}</span>
                </div>
                <div class="pc-line solde${neg ? ' neg' : ''}">
                    <span class="pc-dot sol"></span>
                    <span class="pc-lbl">Solde net</span>
                    <span class="pc-val">${(neg ? '– ' : '') + esc(fcfa(Math.abs(s.solde)))}</span>
                </div>
            </div>
            <div class="pc-foot">${s.nbDep} dépense(s) · ${s.nbTk} ticket(s) · ${s.nbMd} vente(s)</div>
        </div>`;
    }).join('');

    // Journal et répartition : sur l'ensemble des dépenses enregistrées.
    const total = totalDepenses(allDepenses);
    document.getElementById('cat-periode').textContent = 'Toutes les dépenses';
    document.getElementById('jrn-periode').textContent =
        `${allDepenses.length} dépense(s) enregistrée(s) · toutes périodes`;

    renderJournal(allDepenses);
    renderCategories(allDepenses, total);
}

function renderJournal(dep) {
    const c = document.getElementById('dep-container');
    if (!dep.length) {
        c.innerHTML = `<div class="empty-state"><span style="font-size:2rem;display:block;margin-bottom:10px;">🗒️</span>Aucune dépense enregistrée pour le moment.</div>`;
        return;
    }
    const total = totalDepenses(dep);
    c.innerHTML = `<table class="data">
        <thead><tr>
            <th>Date</th><th>Libellé</th><th>Catégorie</th>
            <th class="num">Montant</th><th></th>
        </tr></thead>
        <tbody>${dep.map(d => `<tr>
            <td>${esc(dateHeure(d._ts))}</td>
            <td style="font-weight:600;">${esc(d.libelle)}</td>
            <td><span class="cat-tag">${esc(d.categorie)}</span></td>
            <td class="num">${esc(fcfa(d.montant))}</td>
            <td><button class="btn-del" data-key="${esc(d._key)}">🗑</button></td>
        </tr>`).join('')}</tbody>
        <tfoot><tr>
            <td colspan="4" style="font-weight:800;padding-top:14px;">TOTAL DES DÉPENSES</td>
            <td class="num" style="font-size:1rem;padding-top:14px;">${esc(fcfa(total))}</td><td></td>
        </tr></tfoot>
    </table>`;
}

function renderCategories(dep, total) {
    const c = document.getElementById('cat-container');
    const cats = parCategorie(dep);
    if (!cats.length) { c.innerHTML = `<div class="empty-state">Rien à répartir.</div>`; return; }
    const max = cats[0].montant || 1;
    c.innerHTML = cats.map(k => `
        <div class="cat-row">
            <span class="cr-nom">${esc(k.nom)}</span>
            <span class="cat-bar"><span style="width:${Math.round(k.montant / max * 100)}%"></span></span>
            <span class="cr-val">${esc(fmt(k.montant))}
                <small style="color:var(--muted);font-weight:600;">
                    (${total ? Math.round(k.montant / total * 100) : 0} %)</small>
            </span>
        </div>`).join('');
}

// ── SAISIE ──────────────────────────────────────
const form = document.getElementById('dep-form');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async e => {
    e.preventDefault();
    const libelle = document.getElementById('d-libelle').value.trim();
    const categorie = document.getElementById('d-categorie').value;
    const montant = parseInt(document.getElementById('d-montant').value, 10);
    const dateStr = document.getElementById('d-date').value;

    if (!libelle || !categorie || !dateStr) { toast('Tous les champs obligatoires doivent être remplis.', 'err'); return; }
    if (!Number.isFinite(montant) || montant <= 0) { toast('Le montant doit être un nombre positif.', 'err'); return; }
    if (dateStr > new Date().toISOString().slice(0, 10)) { toast('La date ne peut pas être dans le futur.', 'err'); return; }

    // On horodate à midi : la dépense reste dans le bon jour quel que
    // soit le fuseau, sans risque de basculer la veille ou le lendemain.
    const [y, m, d] = dateStr.split('-').map(Number);
    const ts = new Date(y, m - 1, d, 12, 0, 0).getTime();

    submitBtn.disabled = true; submitBtn.textContent = 'Enregistrement...';
    try {
        await push(depenseRef, {
            libelle, categorie, montant,
            date_ts: ts,
            date: new Date(ts).toLocaleDateString('fr-FR'),
            cree_le: Date.now(),
            cree_par: auth.currentUser?.email || 'inconnu',
        });
        form.reset();
        document.getElementById('d-date').value = new Date().toISOString().slice(0, 10);
        toast('Dépense enregistrée.', 'ok');
    } catch (err) {
        console.error(err);
        toast("Échec de l'enregistrement : " + err.message, 'err');
    } finally {
        submitBtn.disabled = false; submitBtn.textContent = 'Enregistrer la dépense';
    }
});

document.getElementById('dep-container').addEventListener('click', async e => {
    const btn = e.target.closest('.btn-del');
    if (!btn) return;
    if (!confirm('Supprimer cette dépense ? Cette action est irréversible.')) return;
    try { await remove(ref(db, DEPENSES_NODE + '/' + btn.dataset.key)); toast('Dépense supprimée.', 'ok'); }
    catch (err) { toast('Erreur : ' + err.message, 'err'); }
});

// ── EXPORT PDF ──────────────────────────────────
document.getElementById('btn-pdf').addEventListener('click', () => {
    // Le bilan porte sur l'ensemble des dépenses (aucune période sélectionnée).
    const dep = allDepenses, tk = allTickets, md = allVentes;
    const rTk = totalTickets(tk), rMd = totalVentes(md);
    const recettes = rTk + rMd, depenses = totalDepenses(dep);
    const solde = recettes - depenses;

    exporterPDF({
        titre: 'Bilan financier — Dépenses et recettes',
        periodeLabel: 'Synthèse toutes périodes',
        meta: [
            { k: 'Édité le', v: new Date().toLocaleDateString('fr-FR') },
            { k: 'Consultations', v: `${tk.length} ticket(s)` },
            { k: 'Ventes pharmacie', v: `${md.length} vente(s)` },
            { k: 'Dépenses', v: `${dep.length} opération(s)` },
        ],
        resume: [
            { label: 'Recettes consultations', valeur: fcfa(rTk) },
            { label: 'Recettes pharmacie', valeur: fcfa(rMd) },
            { label: 'Total des recettes', valeur: fcfa(recettes), type: 'positif' },
            { label: 'Total des dépenses', valeur: fcfa(depenses), type: 'negatif' },
            { label: 'Solde net du poste', valeur: (solde < 0 ? '– ' : '') + fcfa(Math.abs(solde)),
              type: solde < 0 ? 'negatif' : 'positif' },
        ],
        sections: [
            {
                titre: 'Synthèse par période',
                cols: [
                    { t: 'Période', k: 'periode', w: '28%' },
                    { t: 'Recettes', k: 'recettes', num: true, w: '24%' },
                    { t: 'Dépenses', k: 'depenses', num: true, w: '24%' },
                    { t: 'Solde net', k: 'solde', num: true, w: '24%' },
                ],
                rows: PERIOD_ORDER.map(p => {
                    const s = statsFor(p);
                    return {
                        periode: PERIODES[p].court,
                        recettes: fcfa(s.recettes),
                        depenses: fcfa(s.depenses),
                        solde: (s.solde < 0 ? '– ' : '') + fcfa(Math.abs(s.solde)),
                    };
                }),
                vide: 'Aucune donnée à présenter.',
            },
            {
                titre: 'Journal des dépenses',
                cols: [
                    { t: 'Date', k: 'date', w: '18%' },
                    { t: 'Libellé', k: 'libelle', w: '40%' },
                    { t: 'Catégorie', k: 'cat', w: '27%' },
                    { t: 'Montant', k: 'montant', num: true, w: '15%' },
                ],
                rows: dep.map(d => ({
                    date: new Date(d._ts).toLocaleDateString('fr-FR'),
                    libelle: d.libelle, cat: d.categorie,
                    montant: fcfa(d.montant),
                })),
                totalLabel: 'TOTAL DES DÉPENSES',
                totalValue: fcfa(depenses),
                vide: 'Aucune dépense enregistrée.',
            },
            {
                titre: 'Répartition par catégorie',
                cols: [
                    { t: 'Catégorie', k: 'nom', w: '50%' },
                    { t: 'Opérations', k: 'nb', num: true, w: '20%' },
                    { t: 'Montant', k: 'montant', num: true, w: '15%' },
                    { t: 'Part', k: 'part', num: true, w: '15%' },
                ],
                rows: parCategorie(dep).map(k => ({
                    nom: k.nom, nb: k.nb, montant: fcfa(k.montant),
                    part: (depenses ? Math.round(k.montant / depenses * 100) : 0) + ' %',
                })),
                totalLabel: 'TOTAL',
                totalValue: fcfa(depenses),
                vide: 'Aucune catégorie à présenter.',
            },
        ],
        note: solde < 0
            ? "Attention : le total des dépenses excède les recettes encaissées."
            : "Le solde net correspond à l'ensemble des recettes encaissées diminué de toutes les dépenses enregistrées.",
    });
});

window.addEventListener('beforeunload', () => { off(depenseRef); off(ticketRef); off(medRef); });
</script>
